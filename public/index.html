<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 字詞</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://my.bdfz.net/site-auth.js" defer></script>
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <div class="page-glow page-glow-a"></div>
    <div class="page-glow page-glow-b"></div>
    <main class="shell">
      <section class="arena-grid" id="arena-grid">
        <aside class="left-panel" id="left-panel">
          <section class="article-panel" id="article-panel" hidden>
            <section class="article-catalog" id="article-catalog"></section>
          </section>
        </aside>

        <article class="battle-stage">
          <header class="stage-head">
            <div class="stage-hero">
              <div class="stage-title-row">
                <h1 class="stage-title">AI 字詞</h1>
                <label class="theme-picker" for="theme-select">
                  <span>配色</span>
                  <select id="theme-select">
                    <option value="parchment">宣紙</option>
                    <option value="forest">松墨</option>
                    <option value="ink">夜硯</option>
                  </select>
                </label>
              </div>
              <p class="account-summary" id="account-summary" hidden></p>
            </div>
            <section class="mode-panel" id="mode-panel"></section>
          </header>

          <section class="question-root" id="question-root">
            <div class="empty-state empty-state-quiet"></div>
          </section>

          <div class="round-track" id="round-track" aria-label="本輪作答進度"></div>
        </article>

        <aside class="right-panel" id="right-panel">
          <div class="stage-meta">
            <div class="meta-chip rank-badge" id="rank-badge">
              <span class="meta-label">段位</span>
              <strong id="rank-name">工蜂</strong>
              <em id="rank-mode">常規排位</em>
            </div>
            <div class="meta-chip">
              <span class="meta-label">本輪</span>
              <strong id="round-fraction">0 / 10</strong>
            </div>
            <div class="meta-chip">
              <span class="meta-label">全對晉級</span>
              <strong id="round-goal">0 / 10</strong>
            </div>
          </div>
          <section class="leaderboard-panel">
            <header class="panel-head">
              <div class="panel-head-copy">
                <p>排行榜</p>
              </div>
            </header>
            <div class="leaderboard-tabs" aria-label="排行榜週期">
              <button class="leaderboard-tab active" data-scope="total" type="button">總榜</button>
              <button class="leaderboard-tab" data-scope="weekly" type="button">週榜</button>
              <button class="leaderboard-tab" data-scope="daily" type="button">日榜</button>
            </div>
            <div class="leaderboard-meta" id="leaderboard-meta">統計範圍：全部歷史</div>
            <div class="leaderboard-root" id="leaderboard-root"></div>
          </section>
        </aside>
      </section>
    </main>

    <div class="feedback-modal" id="feedback-modal" hidden>
      <div class="feedback-dialog">
        <div class="feedback-dialog-head">
          <div>
            <strong>題目問題反饋</strong>
            <p id="feedback-prompt-meta"></p>
          </div>
          <button id="feedback-close" class="feedback-close" type="button" aria-label="關閉">×</button>
        </div>
        <form id="feedback-form" class="feedback-form">
          <label class="feedback-field feedback-anon-row">
            <span>匿名提交</span>
            <input id="feedback-anonymous" name="anonymous" type="checkbox" />
          </label>
          <label class="feedback-field">
            <span>顯示名稱</span>
            <input id="feedback-name" name="reporterName" type="text" maxlength="80" placeholder="匿名" />
          </label>
          <label class="feedback-field">
            <span>這道題有什麼問題？</span>
            <textarea
              id="feedback-message"
              name="message"
              rows="6"
              maxlength="4000"
              placeholder="例如：正確答案有誤、選項不成立、出處不對、解析有無關內容、考察詞不在題幹內。"
              required
            ></textarea>
          </label>
          <label class="feedback-field">
            <span>截圖上傳</span>
            <input id="feedback-screenshot" name="screenshot" type="file" accept="image/*" />
            <em>支持 PNG / JPG / WebP / GIF，單張不超過 8 MB。</em>
          </label>
          <p class="feedback-status" id="feedback-status" aria-live="polite"></p>
          <div class="feedback-actions">
            <button id="feedback-cancel" class="ghost-btn" type="button">取消</button>
            <button id="feedback-submit" class="next-round-btn" type="submit">提交到 GitHub</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
